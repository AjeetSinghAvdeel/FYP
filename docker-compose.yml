services:
  juice-shop:
    image: bkimminich/juice-shop:v17.2.0
    container_name: fyp-juice-shop
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=unsafe
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - local_lab

networks:
  local_lab:
    driver: bridge
    internal: false
